async function open_(){const m=location.hash.match(/k=([A-Za-z0-9_-]+)/);if(!m)return;
try{const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(m[1]),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:IV},key,DATA);
document.open();document.write(new TextDecoder().decode(pt));document.close();
}catch(e){document.getElementById('gate').innerHTML='<b>VOXEL</b><br><br>Ссылка неполная или устарела. Запросите новую у автора проекта.';}}
open_();addEventListener('hashchange',open_);
</script></body></html>
